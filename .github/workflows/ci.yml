name: Validate release gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, home-root-federation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify governed host toolchain
        run: /opt/homebrew/bin/go version
      - name: Validate
        run: ./scripts/validate.sh
